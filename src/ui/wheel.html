<!doctype html>
<html lang="zh-CN" data-surface="wheel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>神豪终端 · 轮盘</title>
<style>/* rc.40 统一星愿卡面样式（由 build.mjs 同步注入 phone.html 与 wheel.html） */
.wc-card{
  position:relative;
  width:var(--wc-w,100%);
  aspect-ratio:5/7;
  display:block;
  color:#f4ecdc;
  contain:layout paint;
  pointer-events:none;
}
.wc-card *{pointer-events:none}

.wc-face{
  position:relative;
  width:100%;
  height:100%;
  border-radius:var(--wc-radius,12px);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:var(--wc-pad,7px);
  border:1.5px solid var(--wc-border,#8e96a8);
  background:var(--wc-bg);
  box-shadow:0 12px 26px rgba(0,0,0,.48),0 0 18px var(--wc-glow,transparent),inset 0 1px 0 rgba(255,255,255,.22);
}
.wc-face::before{
  content:"";
  position:absolute;
  inset:var(--wc-inset,4px);
  border-radius:calc(var(--wc-radius,12px) - 4px);
  border:1px solid var(--wc-inner,rgba(196,204,222,.32));
  pointer-events:none;
  z-index:1;
}
.wc-face::after{
  content:"";
  position:absolute;
  inset:-40%;
  pointer-events:none;
  z-index:3;
  background:linear-gradient(125deg,transparent 38%,var(--wc-sheen,rgba(255,255,255,.2)) 50%,transparent 62%);
  animation:wcCardSheen var(--wc-dur,4.4s) linear infinite;
}
@keyframes wcCardSheen{
  0%{transform:translateX(-65%) rotate(12deg)}
  100%{transform:translateX(65%) rotate(12deg)}
}

/* 四档金属材质 + 虹彩 conic 边（基准：rc39-proto-pack / rc39-proto-casino） */
.wc-gray{
  --wc-bg:radial-gradient(circle at 30% 20%,#454a57,#262932 58%,#16181f);
  --wc-bg-flat:linear-gradient(160deg,#353a46,#1a1d25);
  --wc-border:#8e96a8;
  --wc-inner:rgba(196,204,222,.32);
  --wc-glow:rgba(148,158,180,.2);
  --wc-accent:#cfd6e6;
  --wc-sheen:rgba(220,228,245,.15);
  --wc-dur:5.8s;
}
.wc-red{
  --wc-bg:radial-gradient(circle at 30% 18%,#8f2037,#4e1120 56%,#21080f);
  --wc-bg-flat:linear-gradient(160deg,#701a2d,#280a12);
  --wc-border:#e28a9a;
  --wc-inner:rgba(255,196,206,.4);
  --wc-glow:rgba(224,72,104,.38);
  --wc-accent:#ffbac7;
  --wc-sheen:rgba(255,212,220,.24);
  --wc-dur:4.4s;
}
.wc-gold{
  --wc-bg:radial-gradient(circle at 28% 18%,#c49334,#6f4d14 55%,#261806);
  --wc-bg-flat:linear-gradient(160deg,#9c7224,#2e1e08);
  --wc-border:#f8db8c;
  --wc-inner:rgba(255,240,188,.5);
  --wc-glow:rgba(246,204,104,.44);
  --wc-accent:#ffe69b;
  --wc-sheen:rgba(255,246,206,.32);
  --wc-dur:3.5s;
}
.wc-rainbow,.wc-mystery{
  --wc-bg:radial-gradient(circle at 22% 18%,rgba(164,118,255,.55),transparent 52%),radial-gradient(circle at 80% 78%,rgba(86,232,218,.48),transparent 55%),radial-gradient(circle at 50% 50%,#3d2058,#1b102c 62%,#0f091a);
  --wc-bg-flat:linear-gradient(160deg,#3d2058,#150d24);
  --wc-border:#d6b4ff;
  --wc-inner:rgba(255,232,255,.56);
  --wc-glow:rgba(196,136,255,.52);
  --wc-accent:#aef6ff;
  --wc-sheen:rgba(255,255,255,.36);
  --wc-dur:2.8s;
}
.wc-rainbow .wc-face,.wc-mystery .wc-face{
  border-color:transparent;
  background-image:var(--wc-bg),conic-gradient(from 0deg,#ff80c8,#ffe082,#72f7e0,#9d8cff,#ff80c8);
  background-origin:border-box;
  background-clip:padding-box,border-box;
}

/* 内部排版 */
.wc-top{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  gap:3px;
  font:700 var(--wc-fs-top,8.5px)/1 Georgia,"Songti SC",serif;
  color:var(--wc-accent);
  white-space:nowrap;
}
.wc-tier{flex-shrink:0}
.wc-pool{
  padding:1px 4px;
  border-radius:999px;
  border:1px solid var(--wc-inner);
  font-size:calc(var(--wc-fs-top,8.5px) - 1px);
  line-height:1.1;
  background:rgba(0,0,0,.28);
}
.wc-serial{margin-left:auto;opacity:.85;font-size:calc(var(--wc-fs-top,8.5px) - .5px)}

.wc-art{
  position:relative;
  z-index:2;
  flex:1;
  min-height:0;
  display:grid;
  place-items:center;
  color:var(--wc-accent);
}
.wc-art .wish-glyph{
  width:60%;
  height:60%;
  max-width:68px;
  max-height:68px;
  filter:drop-shadow(0 0 6px var(--wc-glow,transparent));
}
.wc-art .wish-glyph path{stroke-width:1.4}

.wc-foot{
  position:relative;
  z-index:2;
  text-align:center;
  padding:var(--wc-foot-pad,4px 3px);
  border-radius:6px;
  background:rgba(0,0,0,.48);
  border:1px solid var(--wc-inner);
  min-width:0;
}
.wc-name{
  font:700 var(--wc-fs-name,10px)/1.18 "Songti SC",Georgia,serif;
  color:#fff6e8;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.wc-val{
  font:800 var(--wc-fs-val,13px)/1.15 Georgia,serif;
  color:var(--wc-accent);
  margin-top:1px;
}

.wc-streak{
  position:absolute;
  left:6px;
  top:22%;
  z-index:4;
  padding:1px 5px;
  border-radius:999px;
  font-size:8px;
  font-weight:700;
  background:rgba(24,14,10,.78);
  border:1px solid rgba(255,196,120,.55);
  color:#ffe3a8;
}
.wc-lock{
  position:absolute;
  right:6px;
  top:22%;
  z-index:4;
  font-size:10px;
  line-height:1;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));
}
.wc-crack{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:5;
  opacity:0;
}

/* 尺寸密度档：只调变量，不复制 DOM */
.wc-card[data-wc-size="lg"]{--wc-radius:13px;--wc-pad:8px;--wc-inset:4px;--wc-fs-top:9px;--wc-fs-name:10.5px;--wc-fs-val:14px;--wc-foot-pad:4px 4px}
.wc-card[data-wc-size="md"]{--wc-radius:11px;--wc-pad:7px;--wc-inset:3.5px;--wc-fs-top:8px;--wc-fs-name:10px;--wc-fs-val:13px;--wc-foot-pad:3.5px 3px}
.wc-card[data-wc-size="sm"]{--wc-radius:10px;--wc-pad:5px;--wc-inset:3px;--wc-fs-top:7.5px;--wc-fs-name:9px;--wc-fs-val:11.5px;--wc-foot-pad:3px 2px}
.wc-card[data-wc-size="sm"] .wc-pool,.wc-card[data-wc-size="sm"] .wc-serial{display:none}
.wc-card[data-wc-size="xs"]{--wc-radius:8px;--wc-pad:4px;--wc-inset:2.5px;--wc-fs-top:7px;--wc-fs-name:8.5px;--wc-fs-val:10.5px;--wc-foot-pad:2px 2px}
.wc-card[data-wc-size="xs"] .wc-pool,.wc-card[data-wc-size="xs"] .wc-serial,.wc-card[data-wc-size="xs"] .wc-streak{display:none}
.wc-card[data-wc-size="xs"] .wc-art .wish-glyph{width:54%;height:54%}

/* ===== 卡面画质三档减法（挂载在 html[data-cfxq]） ===== */
/* 均衡（默认 medium）：关常驻扫光、去外发光、去纹样 drop-shadow，保留 conic 边与金属径向渐变 */
:root[data-cfxq="medium"] .wc-face::after{animation:none;opacity:0}
:root[data-cfxq="medium"] .wc-face{box-shadow:0 8px 18px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.16)}
:root[data-cfxq="medium"] .wc-art .wish-glyph{filter:none}
:root[data-cfxq="medium"] .wc-art .wish-glyph path{stroke-width:1.25}
/* 卡包翻面瞬间在 medium 仍允许播一次单次扫光 */
:root[data-cfxq="medium"] .pk-slot.is-open .wc-face::after{opacity:1;animation:wcCardSheen 1.1s ease-out 1 forwards}

/* 极简（low）：全关扫光、去 conic 边、去内描边、去阴影、背景降为双色线性渐变 */
:root[data-cfxq="low"] .wc-face::after,
:root[data-cfxq="low"] .wc-face::before{display:none;animation:none}
:root[data-cfxq="low"] .wc-face{
  background:var(--wc-bg-flat);
  border-color:var(--wc-border);
  box-shadow:none;
}
:root[data-cfxq="low"] .wc-rainbow .wc-face,
:root[data-cfxq="low"] .wc-mystery .wc-face{
  background-image:none;
  background:var(--wc-bg-flat);
  border-color:#d6b4ff;
}
:root[data-cfxq="low"] .wc-art .wish-glyph{filter:none}
:root[data-cfxq="low"] .wc-art .wish-glyph path{stroke-width:1.1}

@media(prefers-reduced-motion:reduce){
  .wc-face::after{animation:none!important;opacity:0!important}
}

/* rc.36 全屏轮盘：独立 iframe 文档样式，与酒馆皮肤完全隔离。
   性能铁律：零 SVG filter、零常驻动画；唯一 canvas 粒子 1.6s 后停帧。 */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#ece4d4;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
.wf-root{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;contain:layout paint}
.wf-backdrop{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,rgba(12,10,18,.985),rgba(3,3,6,.995))}
.wf-close{position:fixed;top:14px;right:16px;z-index:20;width:38px;height:38px;border-radius:50%;border:1px solid rgba(217,184,120,.55);background:rgba(20,16,24,.92);color:#f6e3b0;font-size:20px;line-height:1;cursor:pointer}
.wf-close:hover{background:rgba(48,38,30,.95)}
.wf-stage{position:relative;z-index:10;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:24px;max-width:min(96vw,980px);max-height:94dvh;padding:12px}
.wf-left{display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0}
.wf-modes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.wf-modes button{font:inherit;font-size:12px;letter-spacing:.06em;padding:5px 14px;border-radius:999px;border:1px solid rgba(217,184,120,.35);background:rgba(255,255,255,.05);color:#c9bda6;cursor:pointer;transition:background .18s,color .18s}
.wf-modes button.on{background:linear-gradient(180deg,#f6e3b0,#d9b878);color:#2b1f0c;border-color:#f6e3b0;font-weight:700}
.wf-board{position:relative;width:min(74vmin,520px);height:min(74vmin,520px)}
.wf-svg,.wf-fx{position:absolute;inset:0;width:100%;height:100%;display:block}
.wf-fx{pointer-events:none}
.wf-svg .ring.is-spinning{will-change:transform}
.wf-svg .hit-wedge{opacity:0;pointer-events:none;transition:opacity .25s ease}
.wf-svg .hit-wedge.on{opacity:1}
.wf-svg .core-glow{opacity:0;transition:opacity .3s ease}
.wf-svg .core-glow.on{opacity:1}
.wf-go{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:15%;aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;font:inherit;font-weight:800;letter-spacing:.1em;font-size:clamp(11px,1.8vmin,16px);color:#2b1f0c;background:radial-gradient(circle at 34% 28%,#fff6d8,#e9c986 34%,#b98f45 66%,#6d4f1f);box-shadow:0 0 0 2px #2a2013,0 0 0 5px rgba(217,184,120,.5),0 0 20px rgba(246,227,176,.3)}
.wf-go[disabled]{filter:grayscale(.55) brightness(.75);cursor:default}
/* rc.38：极窄屏下 GO 会缩到 37px，低于 40px 触摸底线，这里设尺寸下限。 */
.wf-go{min-width:44px;min-height:44px}
.wf-side{width:300px;max-height:82dvh;overflow-y:auto;flex-shrink:0;padding:14px;border-radius:16px;background:rgba(20,16,26,.985);border:1px solid rgba(217,184,120,.34);box-shadow:0 18px 44px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.wf-side h4{font-size:12.5px;letter-spacing:.06em;color:#f6e3b0;margin:0}
.wf-side p{margin:0;font-size:11.5px;line-height:1.7;color:#b9b2a4}
.wf-side .wf-quote{font-size:12px;color:#f0dcae}
.wf-pays{display:flex;flex-wrap:wrap;gap:6px}
.wf-pays button{flex:1 1 auto;font:inherit;font-size:11px;padding:6px 8px;border-radius:9px;border:1px solid rgba(217,184,120,.3);background:rgba(255,255,255,.05);color:#d8cfbd;cursor:pointer;white-space:nowrap}
.wf-pays button.on{border-color:#f6e3b0;color:#2b1f0c;background:linear-gradient(180deg,#f6e3b0,#d9b878);font-weight:700}
.wf-pays button[disabled]{opacity:.42;cursor:default}
.wf-bets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
/* rc.39 问题 3：赌注按钮只展示色区名 */
.wf-bets button{font:inherit;padding:10px 6px;border-radius:10px;border:1px solid rgba(217,184,120,.28);background:rgba(255,255,255,.05);color:#e3d9c6;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .16s,border-color .16s}
.wf-bets button.wf-bet-red{border-color:rgba(224,96,124,.38)}
.wf-bets button.wf-bet-black{border-color:rgba(168,176,196,.32)}
.wf-bets button.wf-bet-green{border-color:rgba(66,184,126,.38)}
.wf-bets button span{font-size:12px;font-weight:700}
.wf-bets button small{font-size:10px;color:#9d968a}
.wf-bets button.on{border-color:#f6e3b0;background:rgba(246,227,176,.14);box-shadow:inset 0 0 0 1px rgba(246,227,176,.35)}
.wf-cards{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto;scrollbar-width:thin}
.wf-cards button{font:inherit;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid rgba(217,184,120,.24);background:rgba(255,255,255,.04);color:#e3d9c6;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.wf-cards button b{font-size:12px}
.wf-cards button.on{border-color:#f6e3b0;background:rgba(246,227,176,.14)}
.wf-cards button[disabled]{opacity:.5}
.wf-step{font-size:11px;letter-spacing:.04em;color:#8f8878}
.wf-result{position:fixed;left:50%;bottom:20px;z-index:30;transform:translate(-50%,16px);width:min(92vw,420px);padding:14px 16px;border-radius:14px;background:linear-gradient(180deg,rgba(32,26,24,.98),rgba(16,13,18,.99));border:1px solid rgba(217,184,120,.48);opacity:0;pointer-events:none;transition:transform .26s ease,opacity .24s ease;box-shadow:0 18px 48px rgba(0,0,0,.5)}
.wf-result.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.wf-result .rno{font-size:10px;letter-spacing:.2em;color:#9b9384}
.wf-result .rname{font-size:16px;color:#f6e3b0;margin:2px 0 5px}
.wf-result .rtip{font-size:11.5px;line-height:1.65;color:#cfc8bb}
.wf-result .rrow{display:flex;gap:8px;margin-top:10px}
.wf-result .rrow button{flex:1;font:inherit;font-size:11.5px;padding:8px 8px;border-radius:10px;cursor:pointer;border:1px solid rgba(217,184,120,.38);background:rgba(255,255,255,.07);color:#f2e6c8}
.wf-result .rrow button.primary{background:linear-gradient(180deg,#f6e3b0,#d9b878);color:#2b1f0c;border-color:#f6e3b0;font-weight:700}
.wf-result[data-rarity="red"]{border-color:rgba(255,140,162,.55)}
.wf-result[data-rarity="gold"]{border-color:rgba(246,227,176,.7)}
.wf-result[data-rarity="rainbow"]{border-color:rgba(224,179,255,.75)}
.wf-toast{position:fixed;top:16px;left:50%;z-index:40;transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:rgba(24,20,28,.96);border:1px solid rgba(217,184,120,.45);font-size:12px;color:#f6e3b0;opacity:0;pointer-events:none;transition:opacity .2s}
.wf-toast.on{opacity:1}
@media(min-width:1100px){.wf-board{width:min(78vh,640px);height:min(78vh,640px)}}
@media(max-width:860px){
  .wf-stage{flex-direction:column;justify-content:flex-start;gap:10px;width:100%;height:100dvh;max-height:100dvh;padding:50px 10px 14px}
  .wf-board{width:min(82vw,40dvh,330px);height:min(82vw,40dvh,330px)}
  .wf-side{width:min(94vw,420px);flex:0 0 auto;max-height:38dvh}
}
@media(prefers-reduced-motion:reduce){
  .wf-result,.wf-toast{transition:none}
}

/* ===== rc.37 星愿卡包启封台 ===== */
.wf-board.is-pack{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.wf-board.is-pack .wf-svg{display:none}
.wf-board.is-pack .wf-fx{display:block;z-index:12;pointer-events:none}
.wf-board.is-pack .wf-go{position:static;transform:none;width:auto;aspect-ratio:auto;margin-top:0;padding:11px 28px;border-radius:999px;font-size:12px}
.wf-pack{position:static;display:flex;flex-direction:column;align-items:center;gap:10px}
.wf-pack[hidden]{display:none}

/* 池子选择 */
.wf-pools{display:flex;flex-direction:column;gap:6px}
.wf-pools button{font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:11px;border:1px solid rgba(217,184,120,.28);background:rgba(255,255,255,.05);color:#e3d9c6;cursor:pointer}
.wf-pools button b{font-size:12px}
.wf-pools button small{font-size:9.5px;color:#9d968a}
.wf-pools button em{font-style:normal;font-size:10px;color:#c9bda6}
.wf-pools button.on{border-color:#f6e3b0;background:rgba(246,227,176,.14);box-shadow:inset 0 0 0 1px rgba(246,227,176,.32)}

/* 未撕开的卡包 */
.pk-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.pk-pack{position:relative;width:196px;height:274px;border-radius:14px;cursor:grab;touch-action:none;user-select:none;
  background:linear-gradient(160deg,#241c2b 0%,#3a2a44 52%,#161020 100%);
  border:1.5px solid rgba(217,184,120,.55);box-shadow:0 18px 44px rgba(0,0,0,.5);overflow:hidden;contain:layout paint}
.pk-pack:active{cursor:grabbing}
.pk-foil{position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 2px,transparent 2px 9px),radial-gradient(120% 80% at 20% 10%,rgba(224,179,255,.22),transparent 62%)}
.pk-flap{position:absolute;left:0;right:0;top:0;height:38%;transform-origin:top center;
  transform:translateX(calc(var(--pk,0) * 42%)) rotate(calc(var(--pk,0) * -26deg));
  background:linear-gradient(180deg,rgba(246,227,176,.34),rgba(246,227,176,0));border-bottom:1px dashed rgba(246,227,176,.55);transition:transform .12s linear}
.pk-seal{position:absolute;left:50%;top:16%;transform:translate(-50%,-50%) rotate(-6deg);padding:5px 10px;border-radius:6px;
  background:rgba(20,16,24,.86);border:1px solid rgba(246,227,176,.6);color:#f6e3b0;font-size:9px;letter-spacing:.1em;white-space:nowrap}
.pk-tear{position:absolute;left:0;right:0;top:38%;height:1px;background:rgba(246,227,176,.5)}
.pk-hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:10.5px;color:#c9bda6;padding:0 12px;line-height:1.6}
.pk-pack.is-burst{animation:pkBurst .55s ease-out forwards}
@keyframes pkBurst{to{transform:scale(1.06);opacity:0}}

.wf-inline-btn{font:inherit;font-size:11.5px;padding:8px 16px;border-radius:999px;border:1px solid rgba(217,184,120,.38);background:rgba(255,255,255,.06);color:#f2e6c8;cursor:pointer}
.wf-inline-btn.primary{background:linear-gradient(180deg,#f6e3b0,#d9b878);color:#2b1f0c;border-color:#f6e3b0;font-weight:700}
.wf-inline-btn[disabled]{opacity:.45;cursor:default}

/* 三张扇形卡：3 张卡背依次落台 → 点一张 3D 翻一张 → 全翻后收束成扇形 */
.pk-fan{display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:10px 4px 4px;perspective:1100px}
.pk-slot{position:relative;flex:0 0 auto;width:min(26vw,120px);aspect-ratio:5/7;padding:0;border:0;background:transparent;cursor:pointer;
  transform:rotate(var(--fan,0deg)) translateY(0);transition:transform .34s ease;
  animation:pkDeal .42s cubic-bezier(.2,.9,.3,1) backwards;animation-delay:calc(var(--i,0) * 90ms)}
@keyframes pkDeal{0%{opacity:0;transform:translateY(30px) scale(.9)}100%{opacity:1;transform:rotate(var(--fan,0deg)) translateY(0)}}
.pk-slot.is-back:hover{transform:rotate(var(--fan,0deg)) translateY(-8px)}
.pk-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .62s cubic-bezier(.3,.9,.25,1)}
.pk-back,.pk-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pk-back{border-radius:12px;border:1.5px solid rgba(217,184,120,.4);
  background:repeating-linear-gradient(135deg,#2b2136 0 6px,#332741 6px 12px)}
.pk-back::before{content:"";position:absolute;inset:6px;border-radius:8px;border:1px solid rgba(246,227,176,.22)}
.pk-back::after{content:"✧";position:absolute;inset:0;display:grid;place-items:center;font-size:22px;color:rgba(246,227,176,.5)}
.pk-face{transform:rotateY(180deg)}
.pk-slot.is-open .pk-inner{transform:rotateY(180deg)}
/* 四档揭晓光效：灰银雾 / 红绯脉 / 金熔光 / 虹棱镜 */
.pk-halo{position:absolute;inset:-14%;border-radius:18px;pointer-events:none;opacity:0;transition:opacity .3s ease}
.pk-slot.is-open .pk-halo{opacity:1}
.pk-slot.rar-gray .pk-halo{background:radial-gradient(circle,rgba(200,206,220,.16),transparent 66%)}
.pk-slot.rar-red .pk-halo{background:radial-gradient(circle,rgba(224,96,124,.24),transparent 67%);animation:pkHaloPulse 2.4s ease-in-out infinite}
.pk-slot.rar-gold .pk-halo{background:radial-gradient(circle,rgba(246,215,134,.32),transparent 68%);animation:pkHaloPulse 1.9s ease-in-out infinite}
.pk-slot.rar-rainbow .pk-halo{background:conic-gradient(from 0deg,rgba(255,128,200,.26),rgba(255,224,130,.26),rgba(114,247,224,.26),rgba(157,140,255,.26),rgba(255,128,200,.26));animation:pkHaloSpin 3.2s linear infinite}
@keyframes pkHaloPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes pkHaloSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
/* 金熔光轻震 / 虹棱镜强震：作用在整排卡上，避免和单卡翻面 transform 打架 */
.pk-fan.shake-gold{animation:pkShakeGold .42s ease-out}
.pk-fan.shake-prism{animation:pkShakePrism .62s ease-out}
@keyframes pkShakeGold{0%,100%{transform:translate(0,0)}30%{transform:translate(-3px,1px)}65%{transform:translate(3px,-1px)}}
@keyframes pkShakePrism{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-6px,2px) rotate(-.6deg)}45%{transform:translate(6px,-2px) rotate(.6deg)}70%{transform:translate(-3px,1px) rotate(-.3deg)}}
/* 全部揭晓后收束成扇形 + 提示可以入册 */
.pk-fan.is-settled .pk-slot{transform:rotate(var(--fan,0deg)) translateY(6px)}
.pk-settled-hint{margin:9px 0 0;text-align:center;font-size:11px;letter-spacing:.04em;color:#f0dcae}
.pk-settled-hint[hidden]{display:none}
/* 三档画质：璀璨满血 / 均衡去震动 / 极速去光效与翻面动画 */
.wf-root[data-fxq="medium"] .pk-halo{animation:none!important;opacity:.62}
.wf-root[data-fxq="medium"] .pk-inner{transition-duration:.38s}
.wf-root[data-fxq="low"] .pk-halo{display:none}
.wf-root[data-fxq="low"] .pk-inner{transition:none}
.wf-root[data-fxq="low"] .pk-slot,.wf-root[data-fxq="low"] .pk-slot.is-open .pk-inner{animation:none}

/* 卡面：5:7，纯渐变 + 1 条 path 纹样，无滤镜无常驻动画 */

.pk-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
@media(max-width:860px){
  .pk-pack{width:152px;height:213px}
}






/* rc.38 想法 16：三盘共用确认弹窗（零 backdrop-filter，用高不透明暗金渐变保性能） */
.wf-confirm-mask{position:fixed;inset:0;z-index:35;background:rgba(6,5,10,.82);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .18s ease}
.wf-confirm-mask.on{opacity:1;pointer-events:auto}
.wf-confirm-mask[hidden]{display:none}
.wf-confirm-box{width:min(90vw,360px);padding:18px 18px 16px;border-radius:16px;background:linear-gradient(180deg,#231c28 0%,#14101a 100%);border:1.5px solid rgba(217,184,120,.55);box-shadow:0 20px 52px rgba(0,0,0,.65);display:flex;flex-direction:column;gap:10px;text-align:center}
.wf-confirm-box h4{margin:0;font-size:15px;letter-spacing:.08em;color:#f6e3b0}
.wf-confirm-cost{align-self:center;padding:4px 12px;border-radius:999px;background:rgba(246,227,176,.14);border:1px solid rgba(246,227,176,.45);color:#fff0be;font-size:12.5px;font-weight:700}
.wf-confirm-meta{font-size:11.5px;line-height:1.65;color:#cfc8bb}
.wf-confirm-warn{font-size:11px;line-height:1.55;color:#ff9fae;padding:6px 10px;border-radius:9px;background:rgba(224,96,124,.12);border:1px solid rgba(224,96,124,.3)}
.wf-confirm-acts{display:flex;gap:10px;margin-top:4px}
.wf-confirm-acts button{flex:1;font:inherit;font-size:12px;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid rgba(217,184,120,.35);background:rgba(255,255,255,.06);color:#e3d9c6}
.wf-confirm-acts button.primary{background:linear-gradient(180deg,#f6e3b0,#d9b878);color:#2b1f0c;border-color:#f6e3b0;font-weight:800}

/* rc.38 想法 15：星愿卡包待机五卡悬浮阵 + 环绕开卡 */
.pk-idle-stage{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;padding:6px 4px}
.pk-stage-head{text-align:center;display:flex;flex-direction:column;gap:3px}
.pk-stage-head b{font-size:13.5px;letter-spacing:.1em;color:#f6e3b0}
.pk-stage-head small{font-size:11.5px;color:#c9bda6}
.pk-float-arc{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;height:206px;width:min(92vw,500px);perspective:800px}
.pk-float-slot{width:min(16vw,86px);aspect-ratio:5/7;flex-shrink:0;transform-origin:center 140%;
  transform:translateY(var(--fy,0)) rotate(var(--rot,0));
  animation:pkFloat 3.2s ease-in-out infinite alternate;animation-delay:calc(var(--fi,0) * -0.55s);
  will-change:transform;transition:opacity .25s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.pk-float-slot.is-high-only{opacity:.42}
/* rc.42：待机漂浮改用纯 transform，不再动 margin-top（会触发布局重排）。 */
@keyframes pkFloat{0%{transform:translateY(calc(var(--fy,0px) - 6px)) rotate(var(--rot,0))}100%{transform:translateY(calc(var(--fy,0px) + 7px)) rotate(var(--rot,0))}}
/* rc.42（YG 拍板方案一）：五卡聚拢重合 → 三段渐强抖动 → 破封爆彩，不再绕圈旋转。 */
.pk-float-arc.is-converging .pk-float-slot{opacity:1;animation:pkConverge var(--pk-dur,1160ms) cubic-bezier(.4,0,.2,1) forwards}
@keyframes pkConverge{
  0%{transform:translate(var(--dx,0px),var(--fy,0px)) rotate(var(--rot,0)) scale(1);opacity:1}
  29.3%{transform:translate(0,0) rotate(0deg) scale(.94);opacity:1}
  46.6%{transform:translate(2px,0) rotate(1.2deg) scale(.97)}
  55.2%{transform:translate(-2px,0) rotate(-1.2deg) scale(.97)}
  65.5%{transform:translate(4.5px,0) rotate(2.4deg) scale(1.02)}
  74.2%{transform:translate(-4.5px,0) rotate(-2.4deg) scale(1.02)}
  81%{transform:translate(7px,0) rotate(3.5deg) scale(1.08)}
  87.9%{transform:translate(-7px,0) rotate(-3.5deg) scale(1.08)}
  94.8%{transform:translate(3px,0) rotate(1.5deg) scale(1.16);opacity:1}
  100%{transform:translate(0,0) rotate(0deg) scale(1.24);opacity:0}
}
.pk-charge-ring{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(246,215,134,.42),rgba(246,215,134,0) 68%)}
.pk-float-arc.is-converging .pk-charge-ring{animation:pkCharge 640ms ease-out 280ms forwards}
@keyframes pkCharge{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:.9}100%{transform:scale(1.45);opacity:0}}
.pk-stage-hint{margin:0;font-size:11px;color:#9d968a;letter-spacing:.04em;text-align:center}
.pk-skip{display:none}
.pk-float-arc.is-converging ~ .pk-skip{display:inline-flex}

/* rc.38 想法 17：画质胶囊（指针按 YG 要求保持删除，不恢复） */
.wf-fxq-wrap{position:relative;display:inline-flex;margin-left:6px}
.wf-fxq{font:inherit;font-size:11px;padding:4px 10px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  border:1px solid rgba(217,184,120,.35);background:rgba(255,255,255,.06);color:#e3d9c6}
.wf-fxq::after{content:'';width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;transition:transform .18s ease}
.wf-fxq-wrap.is-open .wf-fxq{border-color:rgba(246,227,176,.75);background:rgba(246,227,176,.14);color:#f6e3b0}
.wf-fxq-wrap.is-open .wf-fxq::after{transform:rotate(180deg)}
/* rc.39：点一下展开三档下拉，不再循环换档 */
.wf-fxq-menu{position:absolute;top:calc(100% + 6px);right:0;z-index:30;min-width:118px;padding:5px;border-radius:12px;display:flex;flex-direction:column;gap:3px;
  background:rgba(20,16,26,.985);border:1px solid rgba(217,184,120,.42);box-shadow:0 14px 34px rgba(0,0,0,.62)}
.wf-fxq-menu[hidden]{display:none}
.wf-fxq-menu button{font:inherit;font-size:11.5px;letter-spacing:.04em;padding:6px 10px;border-radius:8px;cursor:pointer;text-align:left;white-space:nowrap;
  border:1px solid transparent;background:transparent;color:#c9bda6;transition:background .16s,color .16s}
.wf-fxq-menu button:hover{background:rgba(255,255,255,.07);color:#f0e4cc}
.wf-fxq-menu button.on{background:rgba(246,227,176,.16);border-color:rgba(246,227,176,.42);color:#f6e3b0;font-weight:700}
.wf-fxq-sec{padding:3px 8px 2px;font-size:10px;letter-spacing:.08em;color:#9d968a}
.wf-fxq-div{height:1px;margin:4px 6px;background:rgba(217,184,120,.22)}

/* ===== rc.39 问题 1：三档画质（同一套 SVG 骨架，节点恒 251） ===== */
.wf-svg .wf-ring0-a{fill:#262932}.wf-svg .wf-ring0-b{fill:#323642}
.wf-svg .wf-ring1-a{fill:#4e1523}.wf-svg .wf-ring1-b{fill:#6b1c30}
.wf-svg .wf-ring2-a{fill:#634514}.wf-svg .wf-ring2-b{fill:#8c631e}
.wf-svg .wf-sep{stroke:rgba(217,184,120,.26)}
.wf-svg .wf-ticks-major{stroke:rgba(246,227,176,.72)}
.wf-svg .wf-ticks-minor{stroke:rgba(217,184,120,.32)}
.wf-svg .wf-frame-main{stroke:rgba(217,184,120,.22)}
.wf-svg .wf-frame-inner{stroke:rgba(217,184,120,.14)}
.wf-svg .wf-frame-outer{stroke:rgba(246,227,176,.1)}
.wf-svg path, .wf-svg circle{transition:fill .22s ease,stroke .22s ease,opacity .22s ease}
.wf-root.is-spinning .wf-svg path, .wf-root.is-spinning .wf-svg circle{transition:none}

/* 璀璨：丝绒金属高饱和 + 刻度全显 + 外框全开 */
.wf-root[data-fxq="high"] .wf-ring0-a{fill:#2b3244}.wf-root[data-fxq="high"] .wf-ring0-b{fill:#394259}
.wf-root[data-fxq="high"] .wf-ring1-a{fill:#65162c}.wf-root[data-fxq="high"] .wf-ring1-b{fill:#871f3b}
.wf-root[data-fxq="high"] .wf-ring2-a{fill:#7e5616}.wf-root[data-fxq="high"] .wf-ring2-b{fill:#ad7923}
.wf-root[data-fxq="high"] .wf-sep{stroke:rgba(217,184,120,.46)}
.wf-root[data-fxq="high"] .wf-ticks-major{stroke:rgba(246,227,176,.95);opacity:1}
.wf-root[data-fxq="high"] .wf-ticks-minor{stroke:rgba(217,184,120,.5);opacity:.78}
.wf-root[data-fxq="high"] .wf-frame-main{stroke:rgba(246,227,176,.42)}
.wf-root[data-fxq="high"] .wf-frame-inner{stroke:rgba(217,184,120,.26)}
.wf-root[data-fxq="high"] .wf-frame-outer{stroke:rgba(246,227,176,.2)}
/* v2 盘面自带鎏金外框，容器不再挂方框阴影 */
.wf-root[data-fxq="high"] .core-glow{opacity:.26}

/* 均衡（默认）：标准暗金，仅长刻度 */
.wf-root[data-fxq="medium"] .wf-ticks-minor{opacity:0}
.wf-root[data-fxq="medium"] .wf-frame-outer{opacity:0}
.wf-root[data-fxq="medium"] .core-glow{opacity:0}


/* 极速：哑光扁平，刻度与光晕全关 */
.wf-root[data-fxq="low"] .wf-ring0-a{fill:#202229}.wf-root[data-fxq="low"] .wf-ring0-b{fill:#272a32}
.wf-root[data-fxq="low"] .wf-ring1-a{fill:#3b1822}.wf-root[data-fxq="low"] .wf-ring1-b{fill:#471d29}
.wf-root[data-fxq="low"] .wf-ring2-a{fill:#473517}.wf-root[data-fxq="low"] .wf-ring2-b{fill:#56401c}
.wf-root[data-fxq="low"] .wf-sep{stroke:rgba(217,184,120,.16)}
.wf-root[data-fxq="low"] .wf-ticks-major,.wf-root[data-fxq="low"] .wf-ticks-minor{opacity:0}
.wf-root[data-fxq="low"] .wf-frame-inner,.wf-root[data-fxq="low"] .wf-frame-outer{opacity:0}
.wf-root[data-fxq="low"] .wf-frame-main{stroke:rgba(217,184,120,.16)}
.wf-root[data-fxq="low"] .core-glow{opacity:0!important}

.wf-root[data-fxq="low"] .pk-float-slot{animation:none}
.wf-root[data-fxq="low"] .wf-bead{display:none}

/* ===== rc.39 追加：轮盘 v2 原型复刻（三档做减法） ===== */
@keyframes runeDrift{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.wf-svg .rune-orbit{transform-origin:320px 320px}
.wf-root[data-fxq="high"] .wf-backdrop{backdrop-filter:blur(7px) saturate(.75);-webkit-backdrop-filter:blur(7px) saturate(.75)}
.wf-root[data-fxq="high"] .wf-board:not(.is-pack){filter:drop-shadow(0 26px 60px rgba(0,0,0,.78))}
.wf-root[data-fxq="high"] .rune-orbit{animation:runeDrift 96s linear infinite}
.wf-root[data-fxq="high"] .wf-vig{opacity:1}
.wf-root[data-fxq="high"] .wf-sheen{opacity:1}
.wf-root[data-fxq="medium"] .wf-backdrop{backdrop-filter:none;-webkit-backdrop-filter:none}
.wf-root[data-fxq="medium"] .wf-board{filter:none}
.wf-root[data-fxq="medium"] .rune-orbit{animation:none}
.wf-root[data-fxq="medium"] .wf-sheen{opacity:.5}
.wf-root[data-fxq="medium"] .wf-vig{opacity:.8}
.wf-root[data-fxq="low"] .wf-backdrop{backdrop-filter:none;background:#09090e}
.wf-root[data-fxq="low"] .wf-board{filter:none}
.wf-root[data-fxq="low"] [data-gothic-deco],.wf-root[data-fxq="low"] .wf-vig,.wf-root[data-fxq="low"] .wf-sheen{opacity:0;pointer-events:none}
.wf-root[data-fxq="low"] .rune-orbit{animation:none}

.wf-svg{overflow:visible}

/* v2：盘面在纵向 flex 里不许被压扁，否则 svg 会被容器裁掉外框 */
.wf-board{flex:0 0 auto;min-height:min(74vmin,520px)}

/* ===== rc.39 追加：暗夜赌场 · 赌桌下注台（对齐 casino-proto.html） ===== */
.wf-root[data-mode="casino"] .wf-side{width:min(94vw,346px)}
.bet-console{display:flex;flex-direction:column;gap:9px}
.console-hd{display:flex;align-items:center;justify-content:space-between}
.console-hd b{font:700 13px "Songti SC",Georgia,serif;letter-spacing:.12em;color:#fff0c4}
.bc-points{padding:3px 10px;border-radius:999px;background:rgba(246,215,134,.14);border:1px solid rgba(246,215,134,.45);color:#ffe8a8;font:700 11.5px Georgia,serif}
.stake-zone{display:flex;align-items:center;gap:10px;padding:9px;border-radius:14px;border:1.5px dashed rgba(246,215,134,.45);background:radial-gradient(circle at 30% 50%,rgba(246,215,134,.08),rgba(8,6,12,.6));min-height:124px;transition:border-color .2s,background .2s}
.stake-zone.drag-over{border-color:#ffe69b;background:rgba(246,215,134,.16)}
.stake-zone.has-card{border-style:solid;border-color:rgba(246,215,134,.62)}
.stake-face{width:84px;flex-shrink:0;display:grid;place-items:center}
.stake-hint{width:84px;padding:9px 6px;border-radius:10px;border:1px dashed rgba(246,215,134,.32);font-size:10.5px;line-height:1.5;color:#b8ae9c;text-align:center}
.stake-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.stake-lbl{font-size:10.5px;letter-spacing:.06em;color:#9d968a}
.stake-val-big{font:800 21px/1.2 Georgia,serif;color:#ffe69b;text-shadow:0 0 16px rgba(246,215,134,.4)}
.stake-val-big.flash{animation:numPulse .55s ease}
@keyframes numPulse{0%{transform:scale(1)}40%{transform:scale(1.13);color:#fff6cf}100%{transform:scale(1)}}
.streak-badge{align-self:flex-start;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;background:rgba(246,215,134,.18);color:#ffe49c;border:1px solid rgba(246,215,134,.48)}
.stake-btns{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.c-btn{font:inherit;font-size:11px;font-weight:700;padding:6px 10px;border-radius:9px;border:1px solid rgba(246,215,134,.45);background:rgba(255,255,255,.06);color:#f4ead6;cursor:pointer}
.c-btn.primary{background:linear-gradient(135deg,#e4c078,#a07222);color:#201406;border-color:transparent}
.c-btn:disabled{opacity:.42;cursor:not-allowed}
.bet-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.bet-box{border-radius:12px;padding:10px 4px;text-align:center;border:1.5px solid transparent;color:#fff;cursor:pointer;transition:transform .16s,box-shadow .2s,border-color .2s}
.bet-box.red{background:linear-gradient(145deg,#8d1c34,#4b0d1b);border-color:rgba(240,126,148,.45)}
.bet-box.black{background:linear-gradient(145deg,#2a2e39,#12141a);border-color:rgba(164,174,196,.42)}
.bet-box.green{background:linear-gradient(145deg,#176d49,#0a3623);border-color:rgba(104,230,172,.5)}
.bet-box b{display:block;font:700 12.5px "Songti SC",Georgia,serif;letter-spacing:.1em}
.bet-box.selected{transform:translateY(-2px);border-color:#fff0be;box-shadow:0 0 18px rgba(246,215,134,.42)}
.bet-box:disabled{opacity:.42;cursor:not-allowed}
.outcome-banner{padding:7px 10px;border-radius:11px;font-size:11px;line-height:1.55;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.32);color:#d7cebe}
.outcome-banner.win{border-color:rgba(246,215,134,.68);background:rgba(217,168,72,.16);color:#fff2cc}
.outcome-banner.lose{border-color:rgba(224,78,96,.68);background:rgba(130,22,38,.26);color:#ffd2d8}
.hand-hd{font-size:10.5px;letter-spacing:.06em;color:#9d968a}
.hand-tray{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.bc-rule{margin:0;font-size:10.5px;line-height:1.6;color:#9d968a}
.wf-board.shake-win{animation:shakeWin .45s ease-out}
.wf-board.shake-lose{animation:shakeLose .42s ease-out}
@keyframes shakeWin{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px) rotate(-.3deg)}60%{transform:translateX(4px) rotate(.3deg)}}
@keyframes shakeLose{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}55%{transform:translateX(5px)}80%{transform:translateX(-2px)}}

/* rc.40：统一卡面组件的外壳（卡面本身由 card-face.css 提供） */
.pk-face .wc-card{width:100%;height:100%}
.stake-card-wrap{width:84px;cursor:grab}
.bh-card{flex:0 0 auto;padding:0;border:0;background:transparent;cursor:pointer;transition:transform .16s ease,opacity .16s ease}
.bh-card:hover:not(:disabled):not(.in-slot){transform:translateY(-3px)}
.bh-card.in-slot{opacity:.34;transform:scale(.94);pointer-events:none}
.bh-card:disabled{opacity:.35;cursor:not-allowed}

/* rc.42：关闭收口期间禁点，并临时摘掉高清档整屏模糊 —— 避免收口帧重绘卡顿 / 回弹闪烁。 */
