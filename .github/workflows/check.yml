name: Validate card
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:core
      - run: node --check dist/terminal.js
      - name: Verify complete card after a fallback commit is available
        run: |
          if [ "$(node -p "Boolean(require('./release/loader.config.json').fallbackRef)")" = "true" ]; then
            npm run build
            npm run check
          else
            echo "Bootstrap core commit: complete card follows after CDN verification."
          fi
