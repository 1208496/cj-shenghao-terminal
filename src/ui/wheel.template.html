<!doctype html>
<html lang="zh-CN" data-surface="wheel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>神豪终端 · 轮盘</title>
<style>__STYLE__</style>
</head>
<body data-surface="wheel">
<div class="wf-root" id="wfRoot">
  <div class="wf-backdrop" data-close></div>
  <button class="wf-close" data-close aria-label="关闭轮盘">×</button>
  <div class="wf-stage">
    <div class="wf-left">
      <div class="wf-modes" id="wfModes"></div>
      <div class="wf-board">
        <svg viewBox="0 0 640 640" class="wf-svg" id="wfSvg" aria-hidden="true"></svg>
        <canvas class="wf-fx" id="wfFx" width="640" height="640" aria-hidden="true"></canvas>
        <div class="wf-pack" id="wfPack" hidden></div>
        <button class="wf-go" id="wfGo" data-go>GO</button>
      </div>
    </div>
    <aside class="wf-side" id="wfSide"></aside>
  </div>
  <div class="wf-result" id="wfResult" role="dialog" aria-live="polite"></div>
  <div class="wf-toast" id="wfToast" role="status" aria-live="polite"></div>
</div>
<script>window.__CJ_WHEEL_ERR__=[];addEventListener('error',function(e){window.__CJ_WHEEL_ERR__.push(String(e.message)+' @'+String(e.filename)+':'+String(e.lineno));});</script><script>__APP__</script>
</body>
</html>
