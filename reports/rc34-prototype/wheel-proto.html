<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>命运轮盘 · 原型</title>
<style>
:root{
  --ink:#e8e2d4; --sub:#9b9384; --gold:#d9b878; --gold-2:#f6e3b0;
  --gray-a:#2a2d36; --gray-b:#383c48; --gray-line:#7b8294; --gray-sym:#cfd5e3;
  --red-a:#5c1727; --red-b:#7d2036; --red-line:#d98a98; --red-sym:#ffd1d8;
  --gold-a:#755318; --gold-b:#a67a26; --gold-line:#f6d786; --gold-sym:#fff0be;
  --backdrop:rgba(9,7,11,.72);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 700px at 50% -10%,#2a2230 0%,#15121a 45%,#0b0910 100%);
  color:var(--ink);
  font-family:"Cinzel","Trajan Pro","Songti SC","Noto Serif SC",Georgia,serif;
  overflow:hidden;
}
/* 遮罩层：整页压暗 + 轻微降饱和，模拟"跳脱手机"的独立浮层 */
.backdrop{
  position:fixed;inset:0;background:var(--backdrop);
  backdrop-filter:blur(5px) saturate(.75);
  display:grid;place-items:center;
}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.title{font-size:15px;letter-spacing:.5em;color:var(--gold);text-indent:.5em;font-weight:600}
.sub{font-size:11px;letter-spacing:.28em;color:var(--sub);text-indent:.28em}
.modes{display:flex;gap:8px;margin-top:2px}
.modes button{
  font:inherit;font-size:11px;letter-spacing:.14em;padding:5px 14px;cursor:pointer;
  color:var(--sub);background:rgba(255,255,255,.03);border:1px solid #3a3446;border-radius:999px;
  transition:.25s;
}
.modes button.on{color:#1a1410;background:linear-gradient(180deg,var(--gold-2),var(--gold));border-color:var(--gold-2);font-weight:700}
.wheel-wrap{position:relative;filter:drop-shadow(0 26px 60px rgba(0,0,0,.72))}
svg.wheel{display:block;width:min(74vmin,620px);height:min(74vmin,620px);overflow:visible}
.rotor{transform-origin:320px 320px;transition:transform 5.4s cubic-bezier(.13,.72,.05,1)}
/* 中心 GO */
.go{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:17%;aspect-ratio:1;border-radius:50%;cursor:pointer;border:none;
  background:
    radial-gradient(circle at 34% 28%,#fff6d8 0%,#e9c986 26%,#b98f45 58%,#6d4f1f 100%);
  box-shadow:
    0 0 0 2px #2a2013, 0 0 0 5px rgba(217,184,120,.55),
    0 0 26px rgba(246,227,176,.4), inset 0 -6px 14px rgba(60,38,10,.75), inset 0 5px 10px rgba(255,247,220,.6);
  color:#2b1f0c;font:inherit;font-weight:700;letter-spacing:.16em;text-indent:.16em;font-size:clamp(11px,2.1vmin,17px);
  transition:transform .18s, box-shadow .25s;
}
.go:hover{transform:translate(-50%,-50%) scale(1.045);box-shadow:0 0 0 2px #2a2013,0 0 0 6px rgba(246,227,176,.7),0 0 40px rgba(246,227,176,.55),inset 0 -6px 14px rgba(60,38,10,.75),inset 0 5px 10px rgba(255,247,220,.6)}
.go:active{transform:translate(-50%,-50%) scale(.97)}
.go:disabled{filter:grayscale(.5) brightness(.8);cursor:default}
/* 指针 */
.spire{position:absolute;left:50%;top:-6.5%;transform:translateX(-50%);width:3.6%;height:17%;filter:drop-shadow(0 0 14px rgba(246,227,176,.9)) drop-shadow(0 3px 6px rgba(0,0,0,.8));pointer-events:none}
/* 结果卡 */
.card{
  position:fixed;left:50%;bottom:5%;transform:translate(-50%,26px);
  width:min(88vw,430px);padding:16px 20px 18px;border-radius:14px;text-align:center;
  background:linear-gradient(180deg,rgba(32,26,22,.97),rgba(18,14,16,.98));
  border:1px solid rgba(217,184,120,.42);
  box-shadow:0 22px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,240,190,.18);
  opacity:0;pointer-events:none;transition:.45s cubic-bezier(.2,.8,.2,1);
}
.card.show{opacity:1;transform:translate(-50%,0)}
.card .no{font-size:11px;letter-spacing:.3em;color:var(--sub)}
.card .nm{font-size:22px;margin:6px 0 10px;letter-spacing:.12em;color:var(--gold-2)}
.card .tip{font-size:13px;line-height:1.75;color:#cfc8bb}
.card .rar{display:inline-block;margin-top:12px;font-size:10px;letter-spacing:.24em;padding:3px 10px;border-radius:999px;border:1px solid currentColor}
.hint{font-size:10.5px;letter-spacing:.2em;color:#6d6558}
/* 假聊天背景：只为演示"浮层盖在正文上、背景压暗模糊"的效果 */
.fake-chat{position:fixed;inset:0;padding:38px clamp(24px,6vw,120px);filter:saturate(.85)}
.fc-bubble{max-width:min(760px,84vw);margin:0 auto 18px;padding:14px 18px;border-radius:14px;font-size:13.5px;line-height:1.85;color:#b9b2a6;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06)}
.fc-bubble.me{margin-left:auto;margin-right:auto;background:rgba(120,150,190,.10);color:#a9b6c6}
.fc-bubble span{color:var(--gold)}
</style>
</head>
<body>
<div class="fake-chat" aria-hidden="true">
  <div class="fc-bubble">十一月的云澜市，晴空透着微凉的质感，微风从宽阔的江面拂过。阳光毫无遮拦地穿透两百三十八平米一线江景大平层的全景落地窗。</div>
  <div class="fc-bubble me">我端着咖啡站在落地窗前，问她今天公司那笔融资谈得怎么样。</div>
  <div class="fc-bubble">她今天穿了一身干练的炭灰色西装套裙，修身剪裁的西装外套敞着扣子。听见门口的动静，顾星遥抬起眼，目光正好撞上刚走进来的你。</div>
  <div class="fc-bubble me">我换好衣服，在玄关镜子前理了理领口，抬手看表，准备出门去公司。</div>
  <div class="fc-bubble">电梯门打开时，迎面是创联中心标志性的灰白极简风格大堂。几名挂着工牌的年轻职员正端着冰美式匆匆走过。</div>
</div>
<div class="backdrop">
  <div class="stage">
    <div class="title">命 运 轮 盘</div>
    <div class="sub">FORTUNE WHEEL · 云澜</div>
    <div class="modes">
      <button id="mSingle" class="on">单圈 53 格</button>
      <button id="mRings">三环同心</button>
    </div>
    <div class="wheel-wrap">
      <svg class="wheel" viewBox="0 0 640 640" id="wheel"></svg>
      <svg class="spire" viewBox="0 0 20 60" aria-hidden="true">
        <path d="M10 0 L15 18 L12.5 22 L15 34 L10 60 L5 34 L7.5 22 L5 18 Z" fill="url(#spireGrad)" stroke="#2a2013" stroke-width="1"/>
        <path d="M10 2 L13 19 L10 22 L7 19 Z" fill="rgba(255,250,225,.55)"/>
      </svg>
      <button class="go" id="go">GO</button>
    </div>
    <div class="hint">点 GO 试转 · 仅原型演示</div>
  </div>
</div>

<div class="card" id="card">
  <div class="no" id="cNo"></div>
  <div class="nm" id="cName"></div>
  <div class="tip" id="cTip"></div>
  <div class="rar" id="cRar"></div>
</div>

};

/* ---------- 53 条奖池（从 AGY_COPY_rc34_wheel.md 逐字读取） ---------- */
let POOL = [];
async function loadPool(){
  const res = await fetch('./wheel-copy.md', {cache:'no-store'});
  const txt = await res.text();
  POOL = txt.split(/\r?\n/).map(l=>l.split('\t')).filter(c=>c.length>=5 && /^\d{2}$/.test(c[0].trim()))
    .map(c=>({no:c[0].trim(), name:c[1].trim(), rar:c[2].trim(), tip:c[4].trim()}));
  if(POOL.length!==53) console.warn('奖池条数异常', POOL.length);
}

const RAR = {
  '灰':{a:'--gray-a', b:'--gray-b', line:'--gray-line', sym:'--gray-sym', key:'gray'},
  '红':{a:'--red-a',  b:'--red-b',  line:'--red-line',  sym:'--red-sym',  key:'red'},
  '金':{a:'--gold-a', b:'--gold-b', line:'--gold-line', sym:'--gold-sym', key:'gold'},
  '虹':{a:'--rainbow-a', b:'--rainbow-b', line:'--gold-line', sym:'#fff', key:'rainbow'}
};
const cs = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const C = 320;                       // 圆心
const ring = [                        // 三环定义（外→内）
  {from:0,  to:30, r1:206, r2:292, symR:250, size:17},
  {from:30, to:46, r1:132, r2:198, symR:166, size:19},
  {from:46, to:52, r1:74,  r2:126, symR:100, size:21},
];
const CORE_R = {r1:56, r2:70};

const polar = (r, deg) => { const a = (deg-90)*Math.PI/180; return [C+r*Math.cos(a), C+r*Math.sin(a)]; };
function sectorPath(r1,r2,a0,a1){
  const [x0,y0]=polar(r2,a0),[x1,y1]=polar(r2,a1),[x2,y2]=polar(r1,a1),[x3,y3]=polar(r1,a0);
  const big = (a1-a0)>180?1:0;
  return `M${x0} ${y0} A${r2} ${r2} 0 ${big} 1 ${x1} ${y1} L${x2} ${y2} A${r1} ${r1} 0 ${big} 0 ${x3} ${y3} Z`;
}

const el = (n,attrs)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',n);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;};

function buildSingle(){
  const g = document.getElementById('wheel'); g.innerHTML='';
  g.appendChild(defs());
  const rotor = el('g',{class:'rotor', id:'rotor'});
  const step = 360/53, r1 = 86, r2 = 292, symR = 236;
  POOL.forEach((p,i)=>{
    const a0 = i*step, a1 = a0+step;
    const rar = RAR[p.rar] || RAR['灰'];
    const fill = i%2 ? cs(rar.b) : cs(rar.a);
    rotor.appendChild(el('path',{d:sectorPath(r1,r2,a0,a1), fill, stroke:'rgba(217,184,120,.22)','stroke-width':.8}));
    const [x,y]=polar(symR, a0+step/2);
    const sg = el('g',{transform:`translate(${x} ${y}) rotate(${a0+step/2})`, stroke:cs(rar.sym), fill:'none','stroke-width':1.35,'stroke-linecap':'round','stroke-linejoin':'round',opacity:.92});
    const scale = 18/24;
    sg.appendChild(el('path',{d:SYM[Number(p.no)], transform:`translate(-12 -12) scale(${scale})`, 'stroke-width':1.6}));
    rotor.appendChild(sg);
  });
  g.appendChild(rotor);
  decorate(g, 292, 'single');
  window.__rings = null;
  return {step, r2, offsets:[0]};
}

function buildRings(){
  const g = document.getElementById('wheel'); g.innerHTML='';
  g.appendChild(defs());
  const groups = [], meta = [];
  ring.forEach((cfg,idx)=>{
    const n = cfg.to-cfg.from, step = 360/n;
    const rg = el('g',{class:'rotor', id:'rotor'+idx});
    for(let i=0;i<n;i++){
      const p = POOL[cfg.from+i];
      const a0 = i*step, a1 = a0+step;
      const rar = RAR[p.rar] || RAR['灰'];
      const fill = i%2 ? cs(rar.b) : cs(rar.a);
      rg.appendChild(el('path',{d:sectorPath(cfg.r1,cfg.r2,a0,a1), fill, stroke:'rgba(217,184,120,.25)','stroke-width':.9}));
      const [x,y]=polar(cfg.symR, a0+step/2);
      const sg = el('g',{transform:`translate(${x} ${y}) rotate(${a0+step/2})`, stroke:cs(rar.sym), fill:'none','stroke-width':1.35,'stroke-linecap':'round','stroke-linejoin':'round',opacity:.94});
      sg.appendChild(el('path',{d:SYM[Number(p.no)], transform:`translate(-12 -12) scale(${cfg.size/24})`, 'stroke-width':1.6}));
      rg.appendChild(sg);
    }
    g.appendChild(rg); groups.push(rg); meta.push({step, n, from:cfg.from});
  });
  // 星核虹环
  const core = el('g',{});
  core.appendChild(el('circle',{cx:C,cy:C,r:(CORE_R.r1+CORE_R.r2)/2,fill:'none',stroke:'url(#rainbow)','stroke-width':CORE_R.r2-CORE_R.r1,opacity:.85}));
  g.appendChild(core);
  decorate(g, 292, 'rings');
  window.__rings = {groups, meta};
  return {rings: meta};
}

function defs(){
  const d = el('defs',{});
  const lg = el('linearGradient',{id:'rainbow',x1:'0',y1:'0',x2:'1',y2:'1'});
  [['0%','#8a5cff'],['25%','#3ad1e0'],['50%','#f6e3b0'],['75%','#ff8fc8'],['100%','#8a5cff']].forEach(([o,c])=>{
    lg.appendChild(el('stop',{offset:o,'stop-color':c}));
  });
  d.appendChild(lg);
  const sg = el('linearGradient',{id:'spireGrad',x1:'0',y1:'0',x2:'0',y2:'1'});
  [['0%','#fff6d8'],['45%','#e9c986'],['100%','#8a6a2c']].forEach(([o,c])=>sg.appendChild(el('stop',{offset:o,'stop-color':c})));
  d.appendChild(sg);
  // 体积罩：中心略暗、边缘更暗，模拟金属盘的下陷
  const vg = el('radialGradient',{id:'vignette',cx:'50%',cy:'50%',r:'50%'});
  [['58%','rgba(0,0,0,0)'],['86%','rgba(0,0,0,.18)'],['100%','rgba(0,0,0,.55)']].forEach(([o,c])=>vg.appendChild(el('stop',{offset:o,'stop-color':c})));
  d.appendChild(vg);
  // 左上高光
  const sh = el('radialGradient',{id:'sheen',cx:'32%',cy:'26%',r:'58%'});
  [['0%','rgba(255,246,214,.22)'],['45%','rgba(255,246,214,.06)'],['100%','rgba(255,246,214,0)']].forEach(([o,c])=>sh.appendChild(el('stop',{offset:o,'stop-color':c})));
  d.appendChild(sh);
  return d;
}

function decorate(g, R, mode){
  // 外双环
  g.appendChild(el('circle',{cx:C,cy:C,r:R+6,fill:'none',stroke:'rgba(217,184,120,.55)','stroke-width':1.4}));
  g.appendChild(el('circle',{cx:C,cy:C,r:R+13,fill:'none',stroke:'rgba(217,184,120,.26)','stroke-width':3}));
  g.appendChild(el('circle',{cx:C,cy:C,r:R+17,fill:'none',stroke:'rgba(217,184,120,.12)','stroke-width':1}));
  // 外圈刻度
  const ticks = el('g',{stroke:'rgba(217,184,120,.4)','stroke-width':1});
  for(let i=0;i<120;i++){
    const a=i*3, long = i%10===0;
    const [x1,y1]=polar(R+2,a), [x2,y2]=polar(R+(long?11:6),a);
    ticks.appendChild(el('line',{x1,y1,x2,y2,opacity:long?.9:.4}));
  }
  g.appendChild(ticks);
  // 立体：内暗外亮的罩层
  g.appendChild(el('circle',{cx:C,cy:C,r:R,fill:'url(#vignette)',opacity:.9,'pointer-events':'none'}));
  g.appendChild(el('circle',{cx:C,cy:C,r:R,fill:'url(#sheen)',opacity:.5,'pointer-events':'none'}));
  if(mode==='single'){
    g.appendChild(el('circle',{cx:C,cy:C,r:86,fill:'none',stroke:'rgba(217,184,120,.5)','stroke-width':1.4}));
    g.appendChild(el('circle',{cx:C,cy:C,r:78,fill:'rgba(12,9,14,.94)',stroke:'rgba(217,184,120,.35)','stroke-width':1}));
    g.appendChild(el('circle',{cx:C,cy:C,r:70,fill:'none',stroke:'rgba(217,184,120,.16)','stroke-width':1}));
  }else{
    g.appendChild(el('circle',{cx:C,cy:C,r:CORE_R.r2+3,fill:'none',stroke:'rgba(217,184,120,.45)','stroke-width':1.2}));
    g.appendChild(el('circle',{cx:C,cy:C,r:CORE_R.r1-3,fill:'none',stroke:'rgba(217,184,120,.3)','stroke-width':1}));
  }
}

/* ---------- 转动 ---------- */
let mode='single', busy=false, accSingle=0, accRings=[0,0,0];

function pickIndex(){
  // 原型：按格子数均匀抽（真实实现会按稀有度权重 + 保底）
  return Math.floor(Math.random()*53);
}

function spin(){
  if(busy || POOL.length!==53) return;
  busy = true;
  document.getElementById('go').disabled = true;
  document.getElementById('card').classList.remove('show');

  const pick = pickIndex();
  const p = POOL[pick];
  const rarKey = (RAR[p.rar]||RAR['灰']).key;

  if(mode==='single'){
    const step=360/53, target = pick*step + step/2;      // 该格中心相对 12 点的顺时针角
    const turns = 5 + Math.floor(Math.random()*2);
    accSingle = accSingle + turns*360 + ((360 - target) - (accSingle % 360) + 360) % 360;
    document.getElementById('rotor').style.transform = `rotate(${accSingle}deg)`;
  }else{
    const {groups, meta} = window.__rings;
    // 逐环锁停：越稀有的环转得越久一点，营造"咔嗒"层次
    groups.forEach((g,i)=>{
      const m = meta[i];
      const local = pick - m.from;
      let idx = local, target;
      if(local>=0 && local<m.n){ target = local*m.step + m.step/2; }
      else { idx = Math.floor(Math.random()*m.n); target = idx*m.step + m.step/2; }
      const turns = (i===0?4:i===1?5:6) + Math.floor(Math.random()*2);
      const dir = i===1 ? -1 : 1;                          // 中环反转
      accRings[i] = accRings[i] + dir*(turns*360) + dir*(((360 - target) - (accRings[i] % 360) + 360) % 360);
      g.style.transform = `rotate(${accRings[i]}deg)`;
      g.style.transitionDelay = `${i*0.12}s`;
    });
  }

  const delay = mode==='single' ? 5600 : 6000;
  setTimeout(()=>{
    busy=false;
    document.getElementById('go').disabled=false;
    document.getElementById('cNo').textContent = `NO.${p.no}`;
    document.getElementById('cName').textContent = p.name;
    document.getElementById('cTip').textContent = p.tip;
    const rarEl = document.getElementById('cRar');
    rarEl.textContent = {gray:'灰 · 常见',red:'红 · 少见',gold:'金 · 稀有',rainbow:'虹 · 终极大奖'}[rarKey];
    rarEl.style.color = {gray:'#9aa3b5',red:'#ff9fae',gold:'#f6d786',rainbow:'#b79bff'}[rarKey];
    document.getElementById('card').classList.add('show');
  }, delay);
}

/* ---------- 启动 ---------- */
(async()=>{
  await loadPool();
  buildSingle();
  document.getElementById('mSingle').onclick = ()=>{ mode='single'; document.getElementById('mSingle').classList.add('on'); document.getElementById('mRings').classList.remove('on'); buildSingle(); };
  document.getElementById('mRings').onclick  = ()=>{ mode='rings';  document.getElementById('mRings').classList.add('on');  document.getElementById('mSingle').classList.remove('on'); buildRings(); };
  document.getElementById('go').onclick = spin;
})();
</script>
