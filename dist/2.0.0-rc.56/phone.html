<!doctype html><html lang="zh-CN" data-surface="phone"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>神豪终端</title><style>/* rc.40 统一星愿卡面样式（由 build.mjs 同步注入 phone.html 与 wheel.html） */
.wc-card{
  position:relative;
  width:var(--wc-w,100%);
  aspect-ratio:5/7;
  display:block;
  color:#f4ecdc;
  contain:layout paint;
  pointer-events:none;
}
.wc-card *{pointer-events:none}

.wc-face{
  position:relative;
  width:100%;
  height:100%;
  border-radius:var(--wc-radius,12px);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:var(--wc-pad,7px);
  border:1.5px solid var(--wc-border,#8e96a8);
  background:var(--wc-bg);
  box-shadow:0 12px 26px rgba(0,0,0,.48),0 0 18px var(--wc-glow,transparent),inset 0 1px 0 rgba(255,255,255,.22);
}
.wc-face::before{
  content:"";
  position:absolute;
  inset:var(--wc-inset,4px);
  border-radius:calc(var(--wc-radius,12px) - 4px);
  border:1px solid var(--wc-inner,rgba(196,204,222,.32));
  pointer-events:none;
  z-index:1;
}
.wc-face::after{
  content:"";
  position:absolute;
  inset:-40%;
  pointer-events:none;
  z-index:3;
  background:linear-gradient(125deg,transparent 38%,var(--wc-sheen,rgba(255,255,255,.2)) 50%,transparent 62%);
  animation:wcCardSheen var(--wc-dur,4.4s) linear infinite;
}
@keyframes wcCardSheen{
  0%{transform:translateX(-65%) rotate(12deg)}
  100%{transform:translateX(65%) rotate(12deg)}
}

/* 四档金属材质 + 虹彩 conic 边（基准：rc39-proto-pack / rc39-proto-casino） */
.wc-gray{
  --wc-bg:radial-gradient(circle at 30% 20%,#454a57,#262932 58%,#16181f);
  --wc-bg-flat:linear-gradient(160deg,#353a46,#1a1d25);
  --wc-border:#8e96a8;
  --wc-inner:rgba(196,204,222,.32);
  --wc-glow:rgba(148,158,180,.2);
  --wc-accent:#cfd6e6;
  --wc-sheen:rgba(220,228,245,.15);
  --wc-dur:5.8s;
}
.wc-red{
  --wc-bg:radial-gradient(circle at 30% 18%,#8f2037,#4e1120 56%,#21080f);
  --wc-bg-flat:linear-gradient(160deg,#701a2d,#280a12);
  --wc-border:#e28a9a;
  --wc-inner:rgba(255,196,206,.4);
  --wc-glow:rgba(224,72,104,.38);
  --wc-accent:#ffbac7;
  --wc-sheen:rgba(255,212,220,.24);
  --wc-dur:4.4s;
}
.wc-gold{
  --wc-bg:radial-gradient(circle at 28% 18%,#c49334,#6f4d14 55%,#261806);
  --wc-bg-flat:linear-gradient(160deg,#9c7224,#2e1e08);
  --wc-border:#f8db8c;
  --wc-inner:rgba(255,240,188,.5);
  --wc-glow:rgba(246,204,104,.44);
  --wc-accent:#ffe69b;
  --wc-sheen:rgba(255,246,206,.32);
  --wc-dur:3.5s;
}
.wc-rainbow,.wc-mystery{
  --wc-bg:radial-gradient(circle at 22% 18%,rgba(164,118,255,.55),transparent 52%),radial-gradient(circle at 80% 78%,rgba(86,232,218,.48),transparent 55%),radial-gradient(circle at 50% 50%,#3d2058,#1b102c 62%,#0f091a);
  --wc-bg-flat:linear-gradient(160deg,#3d2058,#150d24);
  --wc-border:#d6b4ff;
  --wc-inner:rgba(255,232,255,.56);
  --wc-glow:rgba(196,136,255,.52);
  --wc-accent:#aef6ff;
  --wc-sheen:rgba(255,255,255,.36);
  --wc-dur:2.8s;
}
.wc-rainbow .wc-face,.wc-mystery .wc-face{
  border-color:transparent;
  background-image:var(--wc-bg),conic-gradient(from 0deg,#ff80c8,#ffe082,#72f7e0,#9d8cff,#ff80c8);
  background-origin:border-box;
  background-clip:padding-box,border-box;
}

/* 内部排版 */
.wc-top{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  gap:3px;
  font:700 var(--wc-fs-top,8.5px)/1 Georgia,"Songti SC",serif;
  color:var(--wc-accent);
  white-space:nowrap;
}
.wc-tier{flex-shrink:0}
.wc-pool{
  padding:1px 4px;
  border-radius:999px;
  border:1px solid var(--wc-inner);
  font-size:calc(var(--wc-fs-top,8.5px) - 1px);
  line-height:1.1;
  background:rgba(0,0,0,.28);
}
.wc-serial{margin-left:auto;opacity:.85;font-size:calc(var(--wc-fs-top,8.5px) - .5px)}

.wc-art{
  position:relative;
  z-index:2;
  flex:1;
  min-height:0;
  display:grid;
  place-items:center;
  color:var(--wc-accent);
}
.wc-art .wish-glyph{
  width:60%;
  height:60%;
  max-width:68px;
  max-height:68px;
  filter:drop-shadow(0 0 6px var(--wc-glow,transparent));
}
.wc-art .wish-glyph path{stroke-width:1.4}

.wc-foot{
  position:relative;
  z-index:2;
  text-align:center;
  padding:var(--wc-foot-pad,4px 3px);
  border-radius:6px;
  background:rgba(0,0,0,.48);
  border:1px solid var(--wc-inner);
  min-width:0;
}
.wc-name{
  font:700 var(--wc-fs-name,10px)/1.18 "Songti SC",Georgia,serif;
  color:#fff6e8;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.wc-val{
  font:800 var(--wc-fs-val,13px)/1.15 Georgia,serif;
  color:var(--wc-accent);
  margin-top:1px;
}

.wc-streak{
  position:absolute;
  left:6px;
  top:22%;
  z-index:4;
  padding:1px 5px;
  border-radius:999px;
  font-size:8px;
  font-weight:700;
  background:rgba(24,14,10,.78);
  border:1px solid rgba(255,196,120,.55);
  color:#ffe3a8;
}
.wc-lock{
  position:absolute;
  right:6px;
  top:22%;
  z-index:4;
  font-size:10px;
  line-height:1;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));
}
.wc-crack{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:5;
  opacity:0;
}

/* 尺寸密度档：只调变量，不复制 DOM */
.wc-card[data-wc-size="lg"]{--wc-radius:13px;--wc-pad:8px;--wc-inset:4px;--wc-fs-top:9px;--wc-fs-name:10.5px;--wc-fs-val:14px;--wc-foot-pad:4px 4px}
.wc-card[data-wc-size="md"]{--wc-radius:11px;--wc-pad:7px;--wc-inset:3.5px;--wc-fs-top:8px;--wc-fs-name:10px;--wc-fs-val:13px;--wc-foot-pad:3.5px 3px}
.wc-card[data-wc-size="sm"]{--wc-radius:10px;--wc-pad:5px;--wc-inset:3px;--wc-fs-top:7.5px;--wc-fs-name:9px;--wc-fs-val:11.5px;--wc-foot-pad:3px 2px}
.wc-card[data-wc-size="sm"] .wc-pool,.wc-card[data-wc-size="sm"] .wc-serial{display:none}
.wc-card[data-wc-size="xs"]{--wc-radius:8px;--wc-pad:4px;--wc-inset:2.5px;--wc-fs-top:7px;--wc-fs-name:8.5px;--wc-fs-val:10.5px;--wc-foot-pad:2px 2px}
.wc-card[data-wc-size="xs"] .wc-pool,.wc-card[data-wc-size="xs"] .wc-serial,.wc-card[data-wc-size="xs"] .wc-streak{display:none}
.wc-card[data-wc-size="xs"] .wc-art .wish-glyph{width:54%;height:54%}

/* ===== 卡面画质三档减法（挂载在 html[data-cfxq]） ===== */
/* 均衡（默认 medium）：关常驻扫光、去外发光、去纹样 drop-shadow，保留 conic 边与金属径向渐变 */
:root[data-cfxq="medium"] .wc-face::after{animation:none;opacity:0}
:root[data-cfxq="medium"] .wc-face{box-shadow:0 8px 18px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.16)}
:root[data-cfxq="medium"] .wc-art .wish-glyph{filter:none}
:root[data-cfxq="medium"] .wc-art .wish-glyph path{stroke-width:1.25}
/* 卡包翻面瞬间在 medium 仍允许播一次单次扫光 */
:root[data-cfxq="medium"] .pk-slot.is-open .wc-face::after{opacity:1;animation:wcCardSheen 1.1s ease-out 1 forwards}

/* 极简（low）：全关扫光、去 conic 边、去内描边、去阴影、背景降为双色线性渐变 */
:root[data-cfxq="low"] .wc-face::after,
:root[data-cfxq="low"] .wc-face::before{display:none;animation:none}
:root[data-cfxq="low"] .wc-face{
  background:var(--wc-bg-flat);
  border-color:var(--wc-border);
  box-shadow:none;
}
:root[data-cfxq="low"] .wc-rainbow .wc-face,
:root[data-cfxq="low"] .wc-mystery .wc-face{
  background-image:none;
  background:var(--wc-bg-flat);
  border-color:#d6b4ff;
}
:root[data-cfxq="low"] .wc-art .wish-glyph{filter:none}
:root[data-cfxq="low"] .wc-art .wish-glyph path{stroke-width:1.1}

@media(prefers-reduced-motion:reduce){
  .wc-face::after{animation:none!important;opacity:0!important}
}

.arousal-bar>div{background:linear-gradient(90deg,#f2c9b6,#c8795f)}

.star-btn.on{background:var(--ui-tag-bg);border-color:var(--ui-accent);color:var(--ui-strong);font-weight:800}
/* rc.24 私密四维档案：沿用九大档案的网格与选中态，只补面板内部排版 */

/* rc.25：财富与奖池改成上下双行大字号，金额不再挤成一团小字 */
.pool .split{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid #ffffff29;padding-top:12px;margin-top:12px}

.asset-tabs{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}
.asset-tabs button{border:1px solid #dee5d9;background:#fffefa;color:#6d8071;border-radius:10px;padding:6px 9px;flex:1 1 calc(25% - 5px);min-width:64px;font-size:calc(11px * var(--cj-font-scale,1))}

.limit-sep{border-top:1px dashed var(--ui-line);margin:7px 0}

/* rc.27：三套主题的扩展语义色（樱粉/魅紫/翠绿/暖金） */
:root{
  --ui-plum-bg:#f4eef8;--ui-plum:#734085;--ui-plum-border:#dcc7e3;
  --ui-green-bg:#e8f3e7;--ui-green:#3b6e4c;--ui-green-border:#c5dcc8;
  --ui-amber-bg:#fdf3df;--ui-amber:#965a1e;--ui-amber-border:#ebd1a7;
}
.theme-gold{
  --ui-plum-bg:#f6edf8;--ui-plum:#7b3b8c;--ui-plum-border:#dfc5e6;
  --ui-green-bg:#eaf5ec;--ui-green:#387049;--ui-green-border:#c3dec8;
  --ui-amber-bg:#fff4df;--ui-amber:#9c5718;--ui-amber-border:#ebd0a0;
}
.theme-purple{
  --ui-plum-bg:#412954;--ui-plum:#e4b8ff;--ui-plum-border:#6d488a;
  --ui-green-bg:#243d35;--ui-green:#9fe3b8;--ui-green-border:#3d695a;
  --ui-amber-bg:#473522;--ui-amber:#ffd596;--ui-amber-border:#785937;
}

/* rc.27：365px 窄屏女性信息分层样式 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px}

.chip-pink{background:var(--ui-pink-bg);color:var(--ui-pink);border-color:var(--ui-pink-border)}
.chip-plum{background:var(--ui-plum-bg);color:var(--ui-plum);border-color:var(--ui-plum-border)}
.chip-muted{background:rgba(120,120,120,.12);color:#7b7468;border-color:rgba(120,120,120,.28)}
.chip-green{background:var(--ui-green-bg);color:var(--ui-green);border-color:var(--ui-green-border)}
.chip-amber{background:var(--ui-amber-bg);color:var(--ui-amber);border-color:var(--ui-amber-border)}

.mini-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:6px 0 8px}
.mini-stat{background:var(--ui-card2);border:1px solid var(--ui-line);border-radius:10px;padding:5px 6px;text-align:center}
.mini-stat small{display:block;font-size:calc(9.5px * var(--cj-font-scale,1));color:var(--ui-sub);line-height:1.2}
.mini-stat b{font-size:calc(11px * var(--cj-font-scale,1));color:var(--ui-ink)}

.kv{display:grid;grid-template-columns:8.2em minmax(0,1fr);gap:7px;padding:5.5px 0;border-bottom:1px dashed var(--ui-line);align-items:baseline;font-size:calc(11px * var(--cj-font-scale,1));line-height:1.6}
.kv:last-child{border-bottom:0;padding-bottom:0}
.kv-k{color:var(--ui-sub);font-size:calc(10.5px * var(--cj-font-scale,1));font-weight:600;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.kv-v{color:var(--ui-ink);min-width:0;overflow-wrap:anywhere}
.kv-v b{color:var(--ui-strong);font-weight:700}
.kv-v b.hl-pink{color:var(--ui-pink)}
.kv-v b.hl-plum{color:var(--ui-plum)}
.kv-v b.hl-strong{color:var(--ui-strong)}

.thought-card{border-left:3px solid var(--ui-pink);background:var(--ui-pink-bg);border-radius:9px;padding:7px 9px;margin:6px 0;color:var(--ui-ink)!important}
.goal-card{border-left:3px solid var(--ui-accent);background:var(--ui-soft);border-radius:9px;padding:7px 9px;margin-top:7px;color:var(--ui-ink)!important;font-weight:600}
.dream-card{border-left:3px solid var(--ui-amber);background:var(--ui-amber-bg);border-radius:9px;padding:7px 9px;margin-top:6px;color:var(--ui-ink)!important;font-weight:600}

.limit-cell{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:4.5px 7px;border-radius:8px;border:1px solid var(--ui-line);background:var(--ui-card2);font-size:calc(10.5px * var(--cj-font-scale,1));white-space:nowrap}
.limit-cell.locked{opacity:.52;background:transparent}
.limit-badge{font-size:calc(9.5px * var(--cj-font-scale,1));font-weight:700;padding:1px 6px;border-radius:6px;color:var(--ui-sub)}

/* rc.27：固定正文底部模式的折叠态横条 */
.folded.folded-bar{width:calc(100% - 4px)!important;height:48px!important;margin:2px!important;padding:0 14px!important;border-radius:14px!important;border-width:2px!important;flex-direction:row!important;justify-content:space-between!important;align-items:center!important;cursor:pointer!important}
.folded-bar-left,.folded-bar-right{display:flex;align-items:center;gap:8px;min-width:0}

.folded-bar-right{flex-shrink:0;position:relative}
.folded-bar-right b{font-size:calc(12.5px * var(--cj-font-scale,1))}
.folded-bar-right small{font-size:calc(10px * var(--cj-font-scale,1));opacity:.85}

/* rc.28：固定正文底部 · 100% 满宽内嵌宽屏面板模式（脱掉手机外壳与刘海） */
body.is-bottom-dock{overflow:visible!important}
.phone.is-bottom-dock{
  height:auto!important;min-height:0!important;max-height:none!important;
  border:1px solid var(--ui-line)!important;border-radius:16px!important;

}

  height:auto!important;min-height:48px!important;padding:10px 16px!important;
  border-bottom:1px solid var(--ui-line);cursor:default!important;
  flex-wrap:wrap;gap:10px;
}
.phone.is-bottom-dock .phone-screen{
  flex:none!important;height:auto!important;max-height:none!important;
  overflow:visible!important;padding:14px 16px 18px!important;

/* 左侧 48×48 旋转小轮盘徽章 */
.mini-wheel-anchor{
  width:46px;height:46px;flex-shrink:0;position:relative;
  display:grid;place-items:center;border-radius:50%;
  box-shadow:0 0 0 1px var(--we-border),0 0 14px var(--we-glow);
  background:radial-gradient(circle,#2f2436 0%,#14101a 100%);
  will-change:transform;
}
.mini-wheel-anchor svg{width:44px;height:44px;display:block;animation:miniSpinCCW 28s linear infinite}
.mini-wheel-anchor.is-cw svg{animation:miniSpinCW 32s linear infinite}
.mini-wheel-anchor.is-fast svg{animation:miniSpinCCW 24s linear infinite}
@keyframes miniSpinCCW{to{transform:rotate(-360deg)}}
@keyframes miniSpinCW{to{transform:rotate(360deg)}}
.mini-wheel-anchor.bounce{animation:miniBounce .36s cubic-bezier(.22,1.4,.36,1)}
@keyframes miniBounce{0%{transform:scale(1)}30%{transform:scale(1.18)}62%{transform:scale(.94)}82%{transform:scale(1.05)}100%{transform:scale(1)}}

.wcard-b-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.wcard-b-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wcard-b-top b{font:700 calc(13.5px * var(--cj-font-scale,1))/1.2 "Songti SC","SimSun",Georgia,serif;letter-spacing:.1em;color:#fff0c4}
.wcard-b-badge{flex:0 0 auto;font-size:calc(9.5px * var(--cj-font-scale,1));padding:2px 7px;border-radius:999px;background:var(--we-badge-bg);color:var(--we-badge-fg);border:1px solid var(--we-badge-bd);font-weight:700;white-space:nowrap}
.wcard-b-meta{font-size:calc(10px * var(--cj-font-scale,1));color:#c9bfa9;line-height:1.45}
.wcard-b-arrow{font-size:18px;color:var(--we-badge-fg,#e7c682);flex-shrink:0;padding-right:1px}

/* ===== 画质档位自动降级（挂载在 html[data-wfxq]，联动 prefs.wheelFxQuality） ===== */
:root[data-wfxq="medium"] .mini-wheel-anchor svg{animation:none;transition:transform .45s ease}
:root[data-wfxq="medium"] .wcard-b:hover .mini-wheel-anchor svg{transform:rotate(36deg)}
:root[data-wfxq="medium"] .wcard-b{box-shadow:0 6px 16px rgba(12,8,18,.24),inset 0 1px 0 rgba(255,242,204,.16)}
:root[data-wfxq="medium"] .mini-wheel-anchor{box-shadow:0 0 0 1px var(--we-border)}

:root[data-wfxq="low"] .wcard-b{background:var(--we-bg-flat);box-shadow:none;transition:none}
:root[data-wfxq="low"] .wcard-b::after{display:none}
:root[data-wfxq="low"] .mini-wheel-anchor{box-shadow:none}
:root[data-wfxq="low"] .mini-wheel-anchor svg{animation:none}

@media(prefers-reduced-motion:reduce){
  .mini-wheel-anchor svg,.mini-wheel-anchor.bounce{animation:none!important}
  .wcard-b::after{display:none}
}
